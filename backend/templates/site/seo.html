<title>{{ seo.title }} · VLICO</title>
<meta name="description" content="{{ seo.description }}">
<meta name="robots" content="{% if seo.indexable %}index,follow{% else %}noindex,nofollow{% endif %}">
{% if seo.canonical %}<link rel="canonical" href="{{ seo.canonical }}">
<meta property="og:type" content="website"><meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="VLICO"><meta property="og:title" content="{{ seo.title }} · VLICO">
<meta property="og:description" content="{{ seo.description }}"><meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}"><meta name="twitter:card" content="summary_large_image">{% endif %}
{{ seo.schema }}

{% load static %}
{% if site_config.eva_widget_id %}
<link rel="stylesheet" href="{% static 'eva-fallback.css' %}">
<a class="vlico-chat-fallback" data-vlico-chat-fallback href="{% url 'request_form' 'consultation' %}" aria-label="Получить консультацию через форму">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/></svg>
  <span>Получить консультацию</span>
</a>
<template id="vlico-chat-invitation">
  <aside class="vlico-chat-invitation" aria-label="Консультация VLICO" data-offer-url="{% url 'chat_offer' %}" hidden>
    <header class="vlico-chat-invitation-header">
      <img class="vlico-chat-avatar" data-chat-avatar src="{% static 'assets/artem-avatar.jpg' %}" width="40" height="40" alt="" decoding="async" draggable="false">
      <div class="vlico-chat-identity"><p class="vlico-chat-heading">Артем</p><p class="vlico-chat-byline">ИИ-консультант VLICO</p></div>
      <button type="button" class="vlico-chat-dismiss" aria-label="Закрыть приглашение"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
    </header>
    <div class="vlico-chat-invitation-body">
      <p data-chat-invitation-copy>Помогу подобрать потолок и освещение. Бесплатная консультация — прямо сейчас.</p>
      <a class="vlico-chat-start" href="{% url 'request_form' 'consultation' %}"><span>Получить консультацию</span><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 19 19 5M5 5h14v14"/></svg></a>
    </div>
  </aside>
</template>
<script src="{% static 'eva-widget.js' %}" defer></script>
<script src="{% url 'eva_widget_relay' 'widget/chat-widget.js' %}?widgetId={{ site_config.eva_widget_id }}&amp;language=ru" data-vlico-eva-vendor async></script>
{% endif %}

<div class="project-nav" data-project-nav>
  <div class="project-nav-trigger">
    <a href="{% url 'projects' %}" {% if request.resolver_match.url_name == 'projects' or request.resolver_match.url_name == 'project' %}aria-current="{% if request.resolver_match.url_name == 'project' or selected_category %}true{% else %}page{% endif %}"{% endif %}>Проекты</a>
    <button class="project-nav-toggle" type="button" aria-label="Направления проектов" aria-expanded="false" aria-controls="{{ nav_id }}" hidden><svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <div class="project-nav-panel" id="{{ nav_id }}" {% if nav_id == 'desktop-projects' %}data-navigation-preview{% endif %} hidden inert>
    <a class="project-nav-all" href="{% url 'projects' %}" {% if request.resolver_match.url_name == 'projects' and not selected_category %}aria-current="page"{% endif %}>Все проекты <span aria-hidden="true">↗</span></a>
    <ul>{% for category in project_navigation %}<li><a href="{% url 'projects' %}?category={{ category.pk }}" {% if nav_id == 'desktop-projects' and category.preview_url %}data-service-preview="{{ category.preview_url }}" data-preview-illustration="{{ category.preview_illustration|yesno:'true,false' }}" {% endif %}{% if selected_category.pk == category.pk %}aria-current="page"{% endif %}>{{ category.title }}</a></li>{% endfor %}</ul>
  </div>
</div>

{% if submission_errors %}<div class="lead-errors" role="alert">{% for field, errors in submission_errors.items %}{% for error in errors %}<p>{{ error }}</p>{% endfor %}{% endfor %}</div>{% endif %}
<div class="lead-errors" data-lead-errors role="alert" hidden></div>
<p class="lead-feedback" data-lead-status role="status" aria-live="polite" hidden></p>

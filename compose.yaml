name: vlico
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vlico}
      POSTGRES_USER: ${POSTGRES_USER:-vlico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-local.ps1 first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  web:
    build: .
    image: vlico-web
    env_file: .env
    environment:
      POSTGRES_HOST: db
      PUBLIC_MEDIA_ROOT: /data/public
      PRIVATE_MEDIA_ROOT: /data/private
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    volumes:
      - public_media:/data/public
      - private_media:/data/private
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
  delivery:
    image: vlico-web
    pull_policy: never
    env_file: .env
    environment:
      POSTGRES_HOST: db
      PRIVATE_MEDIA_ROOT: /data/private
    entrypoint: ["python", "manage.py", "deliver_leads"]
    command: []
    volumes:
      - private_media:/data/private
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/vlico-delivery-heartbeat').st_mtime < 90"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    restart: unless-stopped
volumes:
  database:
  public_media:
  private_media:
